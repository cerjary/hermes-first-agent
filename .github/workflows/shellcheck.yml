name: Lifecycle Quality

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: |
          bash -n check-environment.sh install.sh update.sh uninstall.sh

      - name: ShellCheck
        run: |
          shellcheck check-environment.sh install.sh update.sh uninstall.sh

      - name: Python syntax
        run: |
          python3 -m py_compile scripts/first-agent-helper.py plugins/first-agent-access/__init__.py

      - name: Access-control unit tests
        run: |
          python3 -m unittest discover -s tests -v
