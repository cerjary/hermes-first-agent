name: Shell Scripts Quality

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: |
          bash -n check-environment.sh install.sh update.sh uninstall.sh

      - name: ShellCheck
        run: |
          shellcheck check-environment.sh install.sh update.sh uninstall.sh
